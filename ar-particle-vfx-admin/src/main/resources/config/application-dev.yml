spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/arpfx
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  redis:
    host: 127.0.0.1
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 0

logging:
  config: classpath:log4j2-spring.xml
